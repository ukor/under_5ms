services:
  backend:
    container_name: backend-dev
    build:
      context: ./
      dockerfile: ./Dockerfile.dev
      args:
        - APP_NAME=backend
    command: pnpm --filter backend run dev
    environment:
      - MONGO_NAME=${MONGO_NAME}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_HOST=${MONGO_HOST}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - JWT_SECRET=${JWT_SECRET}
      - APP_NAME=apigateway
      - port=${PORT_APIGATEWAY}
      - PG_HOST=postgresql
      - PG_PORT=5432
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_DB=${PG_DB}
      - NODE_ENV=${environment}
    ports:
      - '3012:3012'
    depends_on:
      mongodb:
          condition: service_healthy
      postgresql:
        condition: service_healthy
    volumes:
      - .:/srv
      - /srv/node_modules
    restart: unless-stopped
    networks:
      - under5ms-network

  frontend:
    container_name: frontend-dev
    build:
      context: ./
      dockerfile: ./Dockerfile.dev
      args:
        - APP_NAME=customer

    command: pnpm --if-present --filter frontend run dev
    environment:
      - MONGO_NAME=${MONGO_NAME}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_HOST=${MONGO_HOST}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - JWT_SECRET=${JWT_SECRET}
      - APP_NAME=customer
      - port=${PORT_CUSTOMER}
      - NODE_ENV=${environment}
    ports:
      - '3013:3013'
    depends_on:
      - mongodb
      - apigateway
    volumes:
      - .:/srv
      - /srv/node_modules
    restart: unless-stopped
    networks:
      - under5ms-network

  docs:
    container_name: docs-dev
    build:
      context: ./
      dockerfile: ./Dockerfile.dev
      args:
        - APP_NAME=order
    command: pnpm --if-present --filter order run dev
    environment:
      - MONGO_NAME=${MONGO_NAME}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_HOST=${MONGO_HOST}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - JWT_SECRET=${JWT_SECRET}
      - APP_NAME=order
      - port=${PORT_ORDER}
      - NODE_ENV=${environment}
    ports:
      - '3014:3014'
    depends_on:
      - mongodb
      - apigateway
    volumes:
      - .:/srv
      - /srv/node_modules
    restart: unless-stopped
    networks:
      - under5ms-network

  postgresql:
    image: postgres:15-alpine
    container_name: postgres-server
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=${PG_USER:-admin}
      - POSTGRES_PASSWORD=${PG_PASSWORD:-password123}
      - POSTGRES_DB=${PG_DB:-under5ms_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-admin} -d ${PG_DB:-under5ms_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - under5ms-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # start the mongodb service as container
  mongodb:
    image: mongo:6.0
    container_name: mongo-server
    restart: unless-stopped
    ports:
      - '27017:27017'
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping')"]
      interval: 15s
      timeout: 7s
      retries: 5
    networks:
      - under5ms-network
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=admin
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=passwordRoot

  networks:
  under5ms-network:

volumes:
  mongo_data:
  postgres_data:
