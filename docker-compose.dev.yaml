services:
  backend:
    container_name: backend-dev
    build:
      context: ./
      dockerfile: ./Dockerfile.dev
      args:
        - APP_NAME=backend
    command: pnpm --filter backend run dev
    environment:
      - MONGO_NAME=${MONGO_NAME}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
      - MONGO_HOST=${MONGO_HOST}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - JWT_SECRET=${JWT_SECRET}
      - APP_NAME=under_5ms_dev
      - port=${PORT_BACKEND}
      - PG_HOST=${PG_HOST}
      - PG_PORT=5432
      - PG_USER=${PG_USER}
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_DB=${PG_DB}
      - NODE_ENV=${environment}
    ports:
      - '3012:3012'
    depends_on:
      mongodb:
          condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - .:/srv
      - /srv/node_modules
    restart: unless-stopped
    networks:
      - under5ms-network

  frontend:
    container_name: frontend-dev
    build:
      context: ./
      dockerfile: ./Dockerfile.dev
      args:
        - APP_NAME=customer

    command: pnpm --if-present --filter frontend run dev
    environment:
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - JWT_SECRET=${JWT_SECRET}
      - APP_NAME=frontend
      - port=${PORT_FRONTEND}
      - NODE_ENV=${environment}
    ports:
      - '3013:3013'
    depends_on:
      - mongodb
      - backend
    volumes:
      - .:/srv
      - /srv/node_modules
    restart: unless-stopped
    networks:
      - under5ms-network

  postgres:
    image: postgres:15-alpine
    container_name: postgres-server
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=${PG_USER:-admin}
      - POSTGRES_PASSWORD=${PG_PASSWORD:-password123}
      - POSTGRES_DB=${PG_DB:-under5ms_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - under5ms-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  caddy:
    image: caddy:latest
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - under5ms-network
    depends_on:
      - backend
      - frontend

  # start the mongodb service as container
  mongodb:
    image: mongo:6.0
    container_name: mongo-server
    restart: unless-stopped
    ports:
      - '27017:27017'
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping')"]
      interval: 15s
      timeout: 7s
      retries: 5
    networks:
      - under5ms-network
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=admin
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=passwordRoot

networks:
  under5ms-network:

volumes:
  mongo_data:
  postgres_data:
  caddy_data:
  caddy_config:
